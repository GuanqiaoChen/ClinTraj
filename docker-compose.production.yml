# Use after assigning IONOS A/AAAA records to a server you control.
services:
  backend:
    environment:
      ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:-clintraj.icu},http://localhost:3000,http://127.0.0.1:3000
  frontend:
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:-clintraj.icu}
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-clintraj.icu}
      CADDY_AUTH_USER: ${CADDY_AUTH_USER:?Set CADDY_AUTH_USER on the server}
      CADDY_AUTH_HASH: ${CADDY_AUTH_HASH:?Set CADDY_AUTH_HASH on the server}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
