[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clintraj"
version = "0.1.0"
description = "Temporally gated, physician-facing clinical decision graph research framework"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5", "openpyxl==3.1.5", "PyYAML==6.0.3", "langgraph==1.0.10"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.6", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915", "types-openpyxl==3.1.5.20250919"]

[project.scripts]
clintraj = "clintraj.cli:main"

[tool.setuptools.packages.find]
include = ["clintraj*", "configs*"]

[tool.setuptools.package-data]
"configs.prompts" = ["*.yaml"]
"configs.experiments" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["golden: local source workbook integration checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
