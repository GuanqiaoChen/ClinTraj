# Standalone public showcase. Do not merge with the clinical Compose files.
name: clintraj-showcase
services:
  frontend:
    build: ./web
    environment:
      CLINTRAJ_SHOWCASE_ONLY: "true"
    expose: ["3000"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-clintraj.icu}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile.showcase:/etc/caddy/Caddyfile:ro
      - showcase_caddy_data:/data
      - showcase_caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  showcase_caddy_data:
  showcase_caddy_config:
