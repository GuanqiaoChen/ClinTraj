name: clintraj
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: clintraj
      POSTGRES_PASSWORD: clintraj_local
      POSTGRES_DB: clintraj
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clintraj -d clintraj"]
      interval: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/clintraj_local
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j_data:/data]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 30
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_NUM_PARALLEL: 1
  model-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen2.5:3b}
    entrypoint: [/bin/sh, -c]
    command: ['until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$$LOCAL_MODEL_NAME"']
  init:
    build: .
    env_file:
      - path: .env
        required: false
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://clintraj:clintraj_local@postgres:5432/clintraj
      NEO4J_URI: bolt://neo4j:7687
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-http://ollama:11434/v1}
      SOURCE_WORKBOOK: /source/医生审核版.xlsx
      EMBEDDING_CACHE: /models
    volumes: &backend_volumes
      - embedding_data:/models
      - ./:/source:ro
      - ./outputs/knowledge:/knowledge
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    command: [sh, -c, "alembic upgrade head && python -m clintraj.server.ingest seed"]
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *backend_env
    volumes: *backend_volumes
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30
  frontend:
    build: ./web
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  neo4j_data:
  ollama_data:
  embedding_data:
